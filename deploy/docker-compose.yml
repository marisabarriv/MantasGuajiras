# =========================================================
# Mantas Guajiras en producción (docs/13-produccion.md).
#   cp .env.example .env      # y completar las claves
#   ./deploy.sh               # copia previa, compila, arranca y verifica
#
# Servicios:
#   web     Caddy: la app y HTTPS automático. ÚNICO servicio con puertos
#           abiertos (80 y 443).
#   backend Spring Boot (perfil prod). Solo accesible desde "web".
#   db      PostgreSQL 17. SIN puertos publicados: nadie fuera del
#           servidor puede conectarse.
#   backup  Copias cada 2 horas (6:00–21:00) y prueba semanal.
# Todos se reinician solos si se caen o si el servidor se reinicia.
# =========================================================
name: mantasguajiras

services:

  db:
    # PostgreSQL 17 lee copias hechas con PostgreSQL 16 o 17. No cambiar
    # POSTGRES_VERSION después de instalar (exigiría copiar y restaurar).
    image: postgres:${POSTGRES_VERSION:-17}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mantas_guajiras_db}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en deploy/.env}
      APP_DB_USER: ${DB_USERNAME:-mantas_app}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en deploy/.env}
      TZ: ${TZ:-America/Bogota}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      args:
        APP_COMMIT: ${APP_COMMIT:-desconocido}
    image: mantasguajiras-backend:${APP_TAG:-actual}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-mantas_guajiras_db}
      DB_USERNAME: ${DB_USERNAME:-mantas_app}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en deploy/.env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-43200000}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:?Falta INITIAL_ADMIN_USERNAME en deploy/.env}
      INITIAL_ADMIN_PHONE: ${INITIAL_ADMIN_PHONE:?Falta INITIAL_ADMIN_PHONE en deploy/.env}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Falta INITIAL_ADMIN_PASSWORD en deploy/.env}
      CORS_ALLOWED_ORIGINS: https://${SITE_ADDRESS:-localhost}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      DISK_MIN_FREE: ${DISK_MIN_FREE:-2GB}
      TZ: ${TZ:-America/Bogota}
    volumes:
      - backend-logs:/app/logs

  web:
    build:
      context: ../frontend
      args:
        APP_COMMIT: ${APP_COMMIT:-}
    image: mantasguajiras-web:${APP_TAG:-actual}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  backup:
    # Imagen completa (no alpine): los scripts de copia usan bash.
    image: postgres:${POSTGRES_VERSION:-17}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["bash", "/deploy/backup-loop.sh"]
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${DB_NAME:-mantas_guajiras_db}
      BACKUP_DIR: /backups
      # Segunda copia: carpeta BACKUP_COPY_TO del servidor (otro disco o
      # carpeta sincronizada con la nube).
      COPY_TO: /copia
      BACKUP_HOURS: ${BACKUP_HOURS:-6 8 10 12 14 16 18 20 21}
      TZ: ${TZ:-America/Bogota}
    volumes:
      - ../scripts/backup:/scripts:ro
      - ./backup-loop.sh:/deploy/backup-loop.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - ${BACKUP_COPY_TO:-./backups-copia}:/copia

volumes:
  db-data:
  backend-logs:
  caddy-data:
  caddy-config:
