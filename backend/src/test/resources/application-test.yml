# =========================================================
# Perfil de PRUEBAS (./mvnw test)
# Usa una base de datos PostgreSQL SEPARADA, nunca la de trabajo:
#   createdb -U postgres mantas_guajiras_test
# Se puede cambiar con TEST_DB_URL, TEST_DB_USERNAME y TEST_DB_PASSWORD.
# =========================================================
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/mantas_guajiras_test}
    username: ${TEST_DB_USERNAME:postgres}
    password: ${TEST_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: clave-solo-para-pruebas-automaticas-no-usar-en-ningun-otro-lado
  expiration: 3600000

initial-admin:
  username: admintest
  phone: "3009998877"
  password: Prueba123

logging:
  level:
    root: WARN
