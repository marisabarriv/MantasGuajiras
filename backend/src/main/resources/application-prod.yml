# =========================================================
# Perfil de PRODUCCIÓN
# Todo valor sensible llega por variables de entorno; aquí no
# hay contraseñas. Ver docs/06-despliegue.md.
# =========================================================
spring:

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

# La documentación interactiva de la API (Swagger) no se publica
# en producción.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

initial-admin:
  username: ${INITIAL_ADMIN_USERNAME}
  phone: ${INITIAL_ADMIN_PHONE}
  password: ${INITIAL_ADMIN_PASSWORD}

logging:
  level:
    root: WARN
    com.mantasguajiras: INFO
    org.flywaydb: INFO
