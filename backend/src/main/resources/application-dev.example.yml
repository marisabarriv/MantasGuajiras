spring:

  datasource:
    url: jdbc:postgresql://localhost:5432/mantas_guajiras_db
    username: postgres
    password: YOUR_PASSWORD
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

initial-admin:
  username: ${INITIAL_ADMIN_USERNAME}
  phone: ${INITIAL_ADMIN_PHONE}
  password: ${INITIAL_ADMIN_PASSWORD}