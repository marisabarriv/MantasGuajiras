<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mantas Guajiras</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #f4f1ea;
            color: #2f2f2f;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .card {
            background: white;

            padding: 30px;

            border-radius: 14px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.10);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        p {
            line-height: 1.5;
        }

        label {
            display: block;

            margin-top: 15px;
            margin-bottom: 6px;

            font-weight: bold;
        }

        .input-container {
            position: relative;
            width: 100%;
        }

        input {
            width: 100%;

            padding: 12px 45px 12px 12px;

            border: 1px solid #ccc;
            border-radius: 7px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #555;
        }

        .password-eye {
            position: absolute;

            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            cursor: pointer;

            font-size: 19px;

            user-select: none;

            color: #666;

            padding: 5px;
        }

        .password-eye:hover {
            color: #222;
        }

        button {
            width: 100%;

            margin-top: 20px;

            padding: 12px;

            border: none;
            border-radius: 7px;

            background: #333;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        .register-question {
            margin-top: 25px;

            text-align: center;

            font-size: 14px;
        }

        .register-link {
            margin-top: 8px;

            width: 100%;

            background: transparent;
            color: #333;

            border: 1px solid #333;
        }

        .register-link:hover {
            background: #f1f1f1;
        }

        .back-button {
            background: transparent;
            color: #333;

            border: 1px solid #ccc;

            margin-bottom: 10px;
        }

        .back-button:hover {
            background: #f1f1f1;
        }

        .result {
            margin-top: 20px;

            padding: 15px;

            border-radius: 7px;

            background: #f1f1f1;

            white-space: pre-wrap;
            word-break: break-word;

            font-size: 14px;
        }

        .hidden {
            display: none;
        }

        .success {
            background: #e8f5e9;
        }

        .error {
            background: #ffebee;
        }

    </style>

</head>


<body>

<div class="container">

    <!-- ========================= -->
    <!-- LOGIN -->
    <!-- ========================= -->

    <div
        id="loginCard"
        class="card"
    >

        <h1>Mantas Guajiras</h1>

        <h2>Iniciar sesión</h2>


        <form id="loginForm">

            <label for="identifier">
                Usuario o teléfono
            </label>

            <input
                type="text"
                id="identifier"
                required
                placeholder="Usuario o teléfono"
            >


            <label for="loginPassword">
                Contraseña
            </label>

            <div class="input-container">

                <input
                    type="password"
                    id="loginPassword"
                    required
                    placeholder="Contraseña"
                >

                <span
                    class="password-eye"
                    id="loginEye"
                    title="Mostrar contraseña"
                >
                    👁️
                </span>

            </div>


            <button type="submit">
                Iniciar sesión
            </button>

        </form>


        <div class="register-question">

            <p>
                ¿No tienes una cuenta?
            </p>

            <button
                type="button"
                class="register-link"
                id="showRegisterButton"
            >
                Crear cuenta
            </button>

        </div>


        <div
            id="loginResult"
            class="result hidden"
        ></div>

    </div>



    <!-- ========================= -->
    <!-- REGISTRO -->
    <!-- ========================= -->

    <div
        id="registerCard"
        class="card hidden"
    >

        <button
            type="button"
            class="back-button"
            id="backToLoginButton"
        >
            ← Volver a iniciar sesión
        </button>


        <h2>Crear cuenta</h2>

        <p>
            Completa los siguientes datos para crear tu cuenta.
        </p>


        <form id="registerForm">

            <label for="registerUsername">
                Usuario
            </label>

            <input
                type="text"
                id="registerUsername"
                required
                placeholder="Nombre de usuario"
            >


            <label for="registerPhone">
                Teléfono
            </label>

            <input
                type="text"
                id="registerPhone"
                required
                placeholder="Número de teléfono"
            >


            <label for="registerPassword">
                Contraseña
            </label>

            <div class="input-container">

                <input
                    type="password"
                    id="registerPassword"
                    required
                    placeholder="Contraseña"
                >

                <span
                    class="password-eye"
                    id="registerEye"
                    title="Mostrar contraseña"
                >
                    👁️
                </span>

            </div>


            <button type="submit">
                Crear cuenta
            </button>

        </form>


        <div
            id="registerResult"
            class="result hidden"
        ></div>

    </div>

</div>



<script>

    const API_URL = "http://localhost:8080";


    // ==========================================
    // CAMBIAR ENTRE LOGIN Y REGISTRO
    // ==========================================

    const loginCard =
        document.getElementById("loginCard");

    const registerCard =
        document.getElementById("registerCard");


    const showRegisterButton =
        document.getElementById("showRegisterButton");


    const backToLoginButton =
        document.getElementById("backToLoginButton");


    showRegisterButton.addEventListener(
        "click",
        function () {

            loginCard.classList.add("hidden");

            registerCard.classList.remove("hidden");

        }
    );


    backToLoginButton.addEventListener(
        "click",
        function () {

            registerCard.classList.add("hidden");

            loginCard.classList.remove("hidden");

        }
    );



    // ==========================================
    // OJO DE CONTRASEÑA
    // ==========================================

    function configurePasswordEye(
        eyeId,
        inputId
    ) {

        const eye =
            document.getElementById(eyeId);

        const input =
            document.getElementById(inputId);


        // --------------------------------------
        // ESCRITORIO
        // --------------------------------------

        eye.addEventListener(
            "mouseenter",
            function () {

                input.type = "text";

            }
        );


        eye.addEventListener(
            "mouseleave",
            function () {

                input.type = "password";

            }
        );


        // --------------------------------------
        // TÁCTIL
        // --------------------------------------

        let touchVisible = false;


        eye.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                touchVisible = !touchVisible;

                input.type =
                    touchVisible
                        ? "text"
                        : "password";

            }
        );

    }


    configurePasswordEye(
        "loginEye",
        "loginPassword"
    );


    configurePasswordEye(
        "registerEye",
        "registerPassword"
    );



    // ==========================================
    // LOGIN
    // ==========================================

    document
        .getElementById("loginForm")
        .addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const identifier =
                    document
                        .getElementById("identifier")
                        .value;


                const password =
                    document
                        .getElementById("loginPassword")
                        .value;


                const result =
                    document
                        .getElementById("loginResult");


                result.classList.remove("hidden");

                result.classList.remove("success");
                result.classList.remove("error");

                result.textContent =
                    "Iniciando sesión...";


                try {

                    const response =
                        await fetch(
                            `${API_URL}/auth/login`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    identifier:
                                        identifier,

                                    password:
                                        password

                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        result.classList.add("error");

                        result.textContent =
                            "No se pudo iniciar sesión.\n\n" +
                            JSON.stringify(
                                data,
                                null,
                                2
                            );

                        return;
                    }


                    // Guardamos el JWT
                    localStorage.setItem(
                        "token",
                        data.token
                    );


                    // Guardamos los datos del usuario
                    localStorage.setItem(
                        "user",
                        JSON.stringify(data)
                    );


                    result.classList.add("success");

                    result.textContent =
                        "Inicio de sesión exitoso.\n\n" +
                        "Usuario: " +
                        data.username +
                        "\nRol: " +
                        data.role;

                }
                catch (error) {

                    result.classList.add("error");

                    result.textContent =
                        "No se pudo conectar con el backend.\n\n" +
                        error;

                }

            }
        );



    // ==========================================
    // REGISTRO
    // ==========================================

    document
        .getElementById("registerForm")
        .addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const username =
                    document
                        .getElementById(
                            "registerUsername"
                        )
                        .value;


                const phone =
                    document
                        .getElementById(
                            "registerPhone"
                        )
                        .value;


                const password =
                    document
                        .getElementById(
                            "registerPassword"
                        )
                        .value;


                const result =
                    document
                        .getElementById(
                            "registerResult"
                        );


                result.classList.remove("hidden");

                result.classList.remove("success");
                result.classList.remove("error");

                result.textContent =
                    "Creando cuenta...";


                try {

                    const response =
                        await fetch(
                            `${API_URL}/auth/register`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    username:
                                        username,

                                    phone:
                                        phone,

                                    password:
                                        password

                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        result.classList.add("error");

                        result.textContent =
                            "No se pudo crear la cuenta.\n\n" +
                            JSON.stringify(
                                data,
                                null,
                                2
                            );

                        return;
                    }


                    result.classList.add("success");

                    result.textContent =
                        "Cuenta creada correctamente.\n\n" +
                        "Ya puedes iniciar sesión.";


                    document
                        .getElementById(
                            "registerForm"
                        )
                        .reset();


                    // Después de crear la cuenta,
                    // volvemos automáticamente al login.

                    setTimeout(
                        function () {

                            registerCard
                                .classList
                                .add("hidden");

                            loginCard
                                .classList
                                .remove("hidden");

                            result.classList
                                .add("hidden");

                        },
                        1500
                    );

                }
                catch (error) {

                    result.classList.add("error");

                    result.textContent =
                        "No se pudo conectar con el backend.\n\n" +
                        error;

                }

            }
        );

</script>

</body>

</html>
